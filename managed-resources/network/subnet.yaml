apiVersion: compute.gcp.upbound.io/v1beta1
kind: Subnetwork
metadata:
  name: crossplane-subnet-us-east1
spec:
  forProvider:
    region: us-east1
    ipCidrRange: 10.0.1.0/24
    networkRef:
      name: crossplane-vpc
    secondaryIpRange:
      - rangeName: pods-range
        ipCidrRange: 10.1.0.0/16
      - rangeName: services-range
        ipCidrRange: 10.2.0.0/20
  providerConfigRef:
    name: default