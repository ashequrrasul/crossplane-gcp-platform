apiVersion: sql.gcp.upbound.io/v1beta2
kind: User
metadata:
  name: crossplane-dbuser
  annotations:
    crossplane.io/external-name: appuser
spec:
  forProvider:
    instanceRef:
      name: crossplane-postgres
    passwordSecretRef:
      namespace: crossplane-system
      name: cloudsql-appuser-secret
      key: password
  providerConfigRef:
    name: default