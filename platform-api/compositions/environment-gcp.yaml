apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: gcp-environment-standard

spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XEnvironment

  mode: Pipeline

  pipeline:
    - step: create-environment-resources
      functionRef:
        name: function-patch-and-transform

      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
################################################################################
# Network Resources
################################################################################

        resources:
          - name: network
            base:
              apiVersion: compute.gcp.upbound.io/v1beta1
              kind: Network
              metadata:
                labels:
                  platform.example.org/resource-type: network
              spec:
                forProvider:
                  autoCreateSubnetworks: false
                  routingMode: REGIONAL
                providerConfigRef:
                  name: default

            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: metadata.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: metadata.annotations[crossplane.io/external-name]

          - name: subnetwork
            base:
              apiVersion: compute.gcp.upbound.io/v1beta1
              kind: Subnetwork
              metadata:
                labels:
                  platform.example.org/resource-type: subnetwork
              spec:
                forProvider:
                  privateIpGoogleAccess: true
                  secondaryIpRange:
                    - rangeName: placeholder-pods-range
                      ipCidrRange: 10.100.0.0/16
                    - rangeName: placeholder-services-range
                      ipCidrRange: 10.101.0.0/20
                  networkRef:
                    name: placeholder-network
                providerConfigRef:
                  name: default

            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                    - fromFieldPath: spec.region
                  strategy: string
                  string:
                    fmt: crossplane-%s-subnet-%s
                toFieldPath: metadata.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                    - fromFieldPath: spec.region
                  strategy: string
                  string:
                    fmt: crossplane-%s-subnet-%s
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region

              - type: FromCompositeFieldPath
                fromFieldPath: spec.subnetCidr
                toFieldPath: spec.forProvider.ipCidrRange

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: spec.forProvider.networkRef.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: "%s-pods-range"
                toFieldPath: spec.forProvider.secondaryIpRange[0].rangeName

              - type: FromCompositeFieldPath
                fromFieldPath: spec.podCidr
                toFieldPath: spec.forProvider.secondaryIpRange[0].ipCidrRange

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: "%s-services-range"
                toFieldPath: spec.forProvider.secondaryIpRange[1].rangeName

              - type: FromCompositeFieldPath
                fromFieldPath: spec.serviceCidr
                toFieldPath: spec.forProvider.secondaryIpRange[1].ipCidrRange
          
          - name: internal-firewall
            base:
              apiVersion: compute.gcp.upbound.io/v1beta2
              kind: Firewall
              metadata:
                annotations:
                  crossplane.io/external-name: placeholder-allow-internal
              spec:
                forProvider:
                  direction: INGRESS
                  allow:
                    - protocol: tcp
                    - protocol: udp
                    - protocol: icmp
                  sourceRanges:
                    - 10.10.0.0/16
                  networkSelector:
                    matchControllerRef: true
                providerConfigRef:
                  name: default

            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.environmentName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: crossplane-%s-allow-internal

          - name: iap-ssh-firewall
            base:
              apiVersion: compute.gcp.upbound.io/v1beta2
              kind: Firewall
              metadata:
                annotations:
                  crossplane.io/external-name: placeholder-allow-iap-ssh
              spec:
                forProvider:
                  direction: INGRESS
                  sourceRanges:
                    - 35.235.240.0/20
                  allow:
                    - protocol: tcp
                      ports:
                        - "22"
                  networkSelector:
                    matchControllerRef: true
                providerConfigRef:
                  name: default

            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.environmentName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: crossplane-%s-allow-iap-ssh
          
          - name: cloud-router
            base:
              apiVersion: compute.gcp.upbound.io/v1beta2
              kind: Router
              metadata:
                annotations:
                  crossplane.io/external-name: placeholder-router
              spec:
                forProvider:
                  region: us-east1
                  networkSelector:
                    matchControllerRef: true
                providerConfigRef:
                  name: default

            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.environmentName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: crossplane-%s-router

              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
          
          - name: cloud-nat
            base:
              apiVersion: compute.gcp.upbound.io/v1beta2
              kind: RouterNAT
              metadata:
                annotations:
                  crossplane.io/external-name: placeholder-nat
              spec:
                forProvider:
                  region: us-east1
                  natIpAllocateOption: AUTO_ONLY
                  sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
                  routerSelector:
                    matchControllerRef: true
                providerConfigRef:
                  name: default

            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.environmentName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: crossplane-%s-nat

              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
          ##############################################################################
          # DATABASE — PRIVATE SERVICE ACCESS RANGE
          ##############################################################################

          - name: private-service-range
            base:
              apiVersion: compute.gcp.upbound.io/v1beta1
              kind: GlobalAddress
              metadata:
                labels:
                  platform.example.org/resource-type: private-service-range
                annotations:
                  crossplane.io/external-name: placeholder-private-service-range

              spec:
                forProvider:
                  addressType: INTERNAL
                  purpose: VPC_PEERING
                  ipVersion: IPV4
                  address: 10.255.0.0
                  prefixLength: 16

                  networkRef:
                    name: placeholder-network

                providerConfigRef:
                  name: default

            patches:
              # Kubernetes managed-resource name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-private-service-range
                toFieldPath: metadata.name

              # Actual GCP resource name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-private-service-range
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              # GCP project
              - type: FromCompositeFieldPath
                fromFieldPath: spec.projectID
                toFieldPath: spec.forProvider.project

              # Reference the VPC created by this Composition
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: spec.forProvider.networkRef.name

              # Convert 10.13.0.0/16 into 10.13.0.0
              - type: FromCompositeFieldPath
                fromFieldPath: spec.database.privateServiceCidr
                toFieldPath: spec.forProvider.address
                transforms:
                  - type: string
                    string:
                      type: Regexp
                      regexp:
                        match: '^([^/]+)/16$'
                        group: 1
          ##############################################################################
          # DATABASE — SERVICE NETWORKING CONNECTION
          ##############################################################################

          - name: service-networking-connection
            base:
              apiVersion: servicenetworking.gcp.upbound.io/v1beta1
              kind: Connection

              metadata:
                labels:
                  platform.example.org/resource-type: service-networking

              spec:
                forProvider:
                  networkRef:
                    name: placeholder-network

                  reservedPeeringRangesRefs:
                    - name: placeholder-private-service-range

                  service: servicenetworking.googleapis.com

                  deletionPolicy: ABANDON

                providerConfigRef:
                  name: default

            patches:
              # Kubernetes managed-resource name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-service-networking
                toFieldPath: metadata.name

              # Reference environment VPC
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: spec.forProvider.networkRef.name

              # Reference the reserved PSA range
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-private-service-range
                toFieldPath: spec.forProvider.reservedPeeringRangesRefs[0].name

          ##############################################################################
          # DATABASE — CLOUD SQL POSTGRESQL INSTANCE
          ##############################################################################

          - name: database-instance
            base:
              apiVersion: sql.gcp.upbound.io/v1beta1
              kind: DatabaseInstance

              metadata:
                labels:
                  platform.example.org/resource-type: database-instance
                annotations:
                  crossplane.io/external-name: placeholder-postgres

              spec:
                forProvider:
                  databaseVersion: POSTGRES_15
                  region: us-east1
                  deletionProtection: false

                  settings:
                    - tier: db-f1-micro
                      availabilityType: ZONAL
                      diskType: PD_SSD
                      diskSize: 20
                      diskAutoresize: true

                      backupConfiguration:
                        - enabled: true
                          pointInTimeRecoveryEnabled: true
                          startTime: "03:00"

                      ipConfiguration:
                        - ipv4Enabled: false
                          privateNetworkRef:
                            name: placeholder-network

                      userLabels:
                        managed-by: crossplane
                        component: cloud-sql

                providerConfigRef:
                  name: default

            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-postgres
                toFieldPath: metadata.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-postgres
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              - type: FromCompositeFieldPath
                fromFieldPath: spec.projectID
                toFieldPath: spec.forProvider.project

              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region

              - type: FromCompositeFieldPath
                fromFieldPath: spec.database.version
                toFieldPath: spec.forProvider.databaseVersion

              - type: FromCompositeFieldPath
                fromFieldPath: spec.database.tier
                toFieldPath: spec.forProvider.settings[0].tier

              - type: FromCompositeFieldPath
                fromFieldPath: spec.database.deletionProtection
                toFieldPath: spec.forProvider.deletionProtection

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: spec.forProvider.settings[0].ipConfiguration[0].privateNetworkRef.name
##############################################################################
# DATABASE
##############################################################################

          - name: database
            base:
              apiVersion: sql.gcp.upbound.io/v1beta1
              kind: Database

              metadata:
                labels:
                  platform.example.org/resource-type: database
                annotations:
                  crossplane.io/external-name: placeholder-db

              spec:
                forProvider:
                  instanceRef:
                    name: placeholder-instance

                providerConfigRef:
                  name: default

            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-database
                toFieldPath: metadata.name

              - type: FromCompositeFieldPath
                fromFieldPath: spec.database.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-postgres
                toFieldPath: spec.forProvider.instanceRef.name

##############################################################################
# SECRET MANAGEMENT
##############################################################################

          - name: database-password-secret
            base:
              apiVersion: secretmanager.gcp.upbound.io/v1beta2
              kind: Secret

              metadata:
                labels:
                  platform.example.org/resource-type: database-password-secret
                annotations:
                  crossplane.io/external-name: placeholder-db-password

              spec:
                forProvider:
                  project: placeholder-project
                  replication:
                    auto: {}

                  deletionProtection: false

                  labels:
                    managed-by: crossplane
                    component: cloud-sql
                    secret-type: database-password

                providerConfigRef:
                  name: default

            patches:
              # Kubernetes managed-resource name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-db-password-secret
                toFieldPath: metadata.name

              # Actual GCP Secret Manager secret ID
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: "%s-db-password"
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              # GCP project
              - type: FromCompositeFieldPath
                fromFieldPath: spec.projectID
                toFieldPath: spec.forProvider.project

              # Environment label
              - type: FromCompositeFieldPath
                fromFieldPath: spec.environmentName
                toFieldPath: spec.forProvider.labels.environment
                
################################################################################
# GKE Resources
################################################################################       
          - name: cluster
            base:
              apiVersion: container.gcp.upbound.io/v1beta2
              kind: Cluster
              metadata:
                labels:
                  platform.example.org/resource-type: gke-cluster
              spec:
                forProvider:
                  removeDefaultNodePool: true
                  initialNodeCount: 1
                  networkingMode: VPC_NATIVE
                  deletionProtection: false

                  networkRef:
                    name: placeholder-network

                  subnetworkRef:
                    name: placeholder-subnetwork
                  
                  privateClusterConfig:
                    enablePrivateNodes: true
                    enablePrivateEndpoint: false
                    masterIpv4CidrBlock: 172.16.255.0/28

                  ipAllocationPolicy:
                    clusterSecondaryRangeName: placeholder-pods-range
                    servicesSecondaryRangeName: placeholder-services-range

                  workloadIdentityConfig:
                    workloadPool: placeholder-project.svc.id.goog

                providerConfigRef:
                  name: default

            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-gke
                toFieldPath: metadata.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-gke
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone
                toFieldPath: spec.forProvider.location

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-vpc
                toFieldPath: spec.forProvider.networkRef.name
              
              - type: FromCompositeFieldPath
                fromFieldPath: spec.masterCidr
                toFieldPath: spec.forProvider.privateClusterConfig.masterIpv4CidrBlock
              
              - type: FromCompositeFieldPath
                fromFieldPath: spec.privateEndpoint
                toFieldPath: spec.forProvider.privateClusterConfig.enablePrivateEndpoint

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                    - fromFieldPath: spec.region
                  strategy: string
                  string:
                    fmt: crossplane-%s-subnet-%s
                toFieldPath: spec.forProvider.subnetworkRef.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: "%s-pods-range"
                toFieldPath: spec.forProvider.ipAllocationPolicy.clusterSecondaryRangeName

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: "%s-services-range"
                toFieldPath: spec.forProvider.ipAllocationPolicy.servicesSecondaryRangeName

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.projectID
                  strategy: string
                  string:
                    fmt: "%s.svc.id.goog"
                toFieldPath: spec.forProvider.workloadIdentityConfig.workloadPool

              - type: FromCompositeFieldPath
                fromFieldPath: spec.deletionProtection
                toFieldPath: spec.forProvider.deletionProtection

          - name: nodepool
            base:
              apiVersion: container.gcp.upbound.io/v1beta2
              kind: NodePool
              metadata:
                labels:
                  platform.example.org/resource-type: gke-nodepool
              spec:
                forProvider:
                  location: us-east1-c
                  clusterRef:
                    name: placeholder-cluster

                  nodeCount: 1

                  nodeConfig:
                    machineType: e2-medium
                    diskSizeGb: 20
                    oauthScopes:
                      - https://www.googleapis.com/auth/cloud-platform

                providerConfigRef:
                  name: default

            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-nodepool
                toFieldPath: metadata.name

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-nodepool
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone
                toFieldPath: spec.forProvider.location

              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.environmentName
                  strategy: string
                  string:
                    fmt: crossplane-%s-gke
                toFieldPath: spec.forProvider.clusterRef.name

              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeCount
                toFieldPath: spec.forProvider.nodeCount

              - type: FromCompositeFieldPath
                fromFieldPath: spec.machineType
                toFieldPath: spec.forProvider.nodeConfig.machineType

              - type: FromCompositeFieldPath
                fromFieldPath: spec.diskSizeGb
                toFieldPath: spec.forProvider.nodeConfig.diskSizeGb