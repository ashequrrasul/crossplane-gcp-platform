apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xgkeclusters.platform.example.org
spec:
  group: platform.example.org

  names:
    kind: XGKECluster
    plural: xgkeclusters

  claimNames:
    kind: GKECluster
    plural: gkeclusters

  versions:
    - name: v1alpha1
      served: true
      referenceable: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              required:
                - projectID
                - location
                - clusterName
                - nodePoolName
                - networkName
                - subnetworkName

              properties:
                projectID:
                  type: string
                  description: GCP project ID

                location:
                  type: string
                  description: GCP zone where the GKE cluster is created
                  default: us-east1-c

                clusterName:
                  type: string
                  description: Name of the GKE cluster

                nodePoolName:
                  type: string
                  description: Name of the GKE node pool

                networkName:
                  type: string
                  description: Existing Crossplane Network managed-resource name

                subnetworkName:
                  type: string
                  description: Existing Crossplane Subnetwork managed-resource name

                podSecondaryRangeName:
                  type: string
                  default: pods-range

                serviceSecondaryRangeName:
                  type: string
                  default: services-range

                machineType:
                  type: string
                  default: e2-medium

                nodeCount:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1

                diskSizeGb:
                  type: integer
                  minimum: 20
                  default: 20

                deletionProtection:
                  type: boolean
                  default: false

            status:
              type: object
              properties:
                clusterStatus:
                  type: string