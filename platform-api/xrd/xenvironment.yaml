apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xenvironments.platform.example.org

spec:
  scope: Cluster

  group: platform.example.org

  names:
    kind: XEnvironment
    plural: xenvironments

  versions:
    - name: v1alpha1
      served: true
      referenceable: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              required:
                - projectID
                - environmentName
                - region
                - zone
                - subnetCidr
                - podCidr
                - serviceCidr
                - masterCidr
                - database

              properties:
                projectID:
                  type: string

                environmentName:
                  type: string

                region:
                  type: string
                  default: us-east1

                zone:
                  type: string
                  default: us-east1-c
                
                privateEndpoint:
                  type: boolean
                  description: Whether the GKE control plane is accessible only through its private endpoint
                  default: false
                
                masterCidr:
                  type: string
                  description: CIDR range used for the GKE private control-plane endpoint
                  pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/28$'

                subnetCidr:
                  type: string

                podCidr:
                  type: string

                serviceCidr:
                  type: string

                machineType:
                  type: string
                  default: e2-medium

                nodeCount:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1

                diskSizeGb:
                  type: integer
                  minimum: 20
                  default: 20

                deletionProtection:
                  type: boolean
                  default: false
                
                database:
                  type: object
                  description: Cloud SQL PostgreSQL configuration

                  required:
                    - enabled
                    - privateServiceCidr
                    - version
                    - tier
                    - name
                    - user

                  properties:
                    enabled:
                      type: boolean
                      default: true

                    privateServiceCidr:
                      type: string
                      description: CIDR range reserved for Private Service Access
                      pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/16$'

                    version:
                      type: string
                      default: POSTGRES_15
                      enum:
                        - POSTGRES_15
                        - POSTGRES_16
                        - POSTGRES_17

                    tier:
                      type: string
                      default: db-f1-micro

                    name:
                      type: string
                      default: appdb

                    user:
                      type: string
                      default: appuser

                    deletionProtection:
                      type: boolean
                      default: false