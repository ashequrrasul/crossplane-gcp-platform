apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qa-db-password
  namespace: crossplane-system
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager

  target:
    name: qa-db-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque

  data:
    - secretKey: password
      remoteRef:
        key: qa-db-password
        version: latest